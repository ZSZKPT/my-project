name: Build Print Studio Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['print_studio/**', 'tests/test_print_studio.py', 'tests/test_fashion_studio.py', '.github/workflows/print-studio.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r print_studio/requirements.txt
      - run: python -m unittest discover -s tests -p test_print_studio.py -v
      - name: Run multi-garment tests with reviewable failure summary
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_fashion_studio.py -v 2>&1 | Tee-Object -FilePath fashion-tests.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '# Multi-garment test failure'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text'
            Get-Content fashion-tests.log | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          }
          exit $result
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "飞凡印花设计" --paths . --add-data "print_studio/assets;assets" print_studio/main.py
      - name: Smoke test desktop application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/飞凡印花设计.exe' -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Print Studio startup test timed out.' }
          if ($process.ExitCode -ne 0) { throw 'Print Studio startup test failed.' }
      - name: Package application and examples
        shell: pwsh
        run: |
          Copy-Item -Recurse print_studio/assets/demo dist/示例模板
          Copy-Item -Recurse print_studio/assets/case67 dist/系统套装模板
          Copy-Item -Recurse print_studio/assets/fashion dist/版型配置与技术示例
          Copy-Item print_studio/README.md dist/使用说明.md
          Copy-Item print_studio/FASHION_STUDIO.md dist/FASHION_STUDIO.md
          Copy-Item print_studio/FASHION_ACCEPTANCE.md dist/FASHION_ACCEPTANCE.md
          Compress-Archive -Path 'dist/飞凡印花设计.exe','dist/使用说明.md','dist/FASHION_STUDIO.md','dist/FASHION_ACCEPTANCE.md','dist/示例模板','dist/系统套装模板','dist/版型配置与技术示例' -DestinationPath 'dist/FeifanPrintStudio-Windows.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: FeifanPrintStudio-Windows
          path: dist/FeifanPrintStudio-Windows.zip
          if-no-files-found: error
  publish-download:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: FeifanPrintStudio-Windows
          path: _windows_bundle
      - name: Publish verified Windows bundle for direct download
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil
          src=Path('_windows_bundle/FeifanPrintStudio-Windows.zip')
          if not 0 < src.stat().st_size < 99_000_000:
              raise SystemExit('Windows bundle exceeds direct Git download limit.')
          target=Path('downloads/FeifanPrintStudio-v0.4-Windows.zip')
          shutil.copyfile(src,target)
          report={'version':'0.4.0','source_commit':os.environ['BUILD_SHA'],
                  'build_run':os.environ['BUILD_RUN'],'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),
                  'bytes':target.stat().st_size,'photoshop':'UNVERIFIED - not installed in CI'}
          Path('downloads/FeifanPrintStudio-v0.4-build.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/FeifanPrintStudio-v0.4-Windows.zip downloads/FeifanPrintStudio-v0.4-build.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish tested Print Studio v0.4 Windows download'
          git push origin HEAD:main
