name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'import_tools/**', 'tests/**', '.github/workflows/windows-exe.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s tests -p test_desktop.py -v
      - run: python -m unittest discover -s tests -p test_miaoshou.py -v
      - run: python -m unittest discover -s tests -p test_print_names.py -v
      - run: python -m unittest discover -s tests -p test_pipeline.py -v
      - run: python -m unittest discover -s tests -p test_price_input.py -v
      - run: python -m unittest discover -s tests -p test_auto_retry.py -v
      - run: python -m unittest discover -s tests -p test_resume.py -v
      - run: python -m unittest discover -s tests -p test_image_rules.py -v
      - run: python -m unittest discover -s tests -p test_task_paths.py -v
      - run: python -m unittest discover -s tests -p test_file_access.py -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "飞凡上架" --paths . --add-data "desktop/assets;assets" desktop/main.py
      - name: Smoke test Windows EXE
        run: |
          $process = Start-Process -FilePath 'dist/飞凡上架.exe' -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'EXE startup test timed out.' }
          if ($process.ExitCode -ne 0) { throw 'EXE startup test failed.' }
      - run: Compress-Archive -Path 'dist/飞凡上架.exe',desktop/README.md -DestinationPath dist/飞凡上架-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FeifanShangjia-Windows
          path: dist/飞凡上架-Windows.zip
          if-no-files-found: error
