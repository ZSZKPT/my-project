name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'import_tools/**', '.github/workflows/windows-exe.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s tests -p test_desktop.py -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TemuImportTool --paths . --add-data "desktop/assets;assets" desktop/main.py
      - run: Compress-Archive -Path dist/TemuImportTool.exe,desktop/README.md -DestinationPath dist/TemuImportTool-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TemuImportTool-Windows
          path: dist/TemuImportTool-Windows.zip
          if-no-files-found: error
