name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'import_tools/**', '.github/workflows/windows-exe.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s tests -p test_desktop.py -v
      - run: python -m unittest discover -s tests -p test_miaoshou.py -v
      - run: python -m unittest discover -s tests -p test_print_names.py -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MiaoshouTemuTool --paths . --add-data "desktop/assets;assets" desktop/main.py
      - name: Smoke test Windows EXE
        run: |
          $process = Start-Process -FilePath dist/MiaoshouTemuTool.exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'EXE startup test timed out.' }
          if ($process.ExitCode -ne 0) { throw 'EXE startup test failed.' }
      - run: Compress-Archive -Path dist/MiaoshouTemuTool.exe,desktop/README.md -DestinationPath dist/MiaoshouTemuTool-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MiaoshouTemuTool-Windows
          path: dist/MiaoshouTemuTool-Windows.zip
          if-no-files-found: error
