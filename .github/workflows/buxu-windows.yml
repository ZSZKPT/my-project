name: Build Buxu Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [buxu-nesting-v1]
    paths: ['nesting/**', '.github/workflows/buxu-windows.yml']
permissions:
  contents: write
concurrency:
  group: buxu-windows-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nesting/requirements.lock
      - name: Install pinned dependencies and packager
        id: install
        run: |
          python -m pip install -r nesting/requirements-desktop.txt
          python -m pip install pyinstaller==6.16.0
      - name: Test geometry, paired panels, and labels
        id: tests
        shell: pwsh
        run: |
          python -m unittest discover -s nesting/tests -v *> "$env:RUNNER_TEMP/buxu-tests.log"
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/buxu-tests.log"
          if ($code -ne 0) { exit $code }
      - name: Build self-contained EXE
        id: package
        working-directory: nesting
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BuxuNesting --collect-all shapely --collect-all svgelements --collect-all webview --collect-all pythonnet --collect-all clr_loader --add-data "web;web" --add-data "examples;examples" desktop_launcher.py
      - name: Execute packaged self-test on Windows
        id: selftest
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'nesting/dist/BuxuNesting.exe' -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Packaged EXE self-test timed out' }
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/BuxuNesting/desktop.log" -ErrorAction SilentlyContinue
            throw 'Packaged EXE self-test failed'
          }
          $window = Start-Process -FilePath 'nesting/dist/BuxuNesting.exe' -ArgumentList '--window-test' -PassThru
          if (-not $window.WaitForExit(150000)) { $window.Kill(); throw 'Embedded window test timed out' }
          if ($window.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/BuxuNesting/desktop.log" -ErrorAction SilentlyContinue
            throw 'Embedded WebView2 window self-test failed'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: BuxuNesting-Windows-EXE
          path: nesting/dist/BuxuNesting.exe
          if-no-files-found: error
      - name: Publish executable download
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'buxu-desktop-v4'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Buxu v4 - background JPG export and full layout preview' --notes 'Windows x64 EXE v4. Choose save location first, then generate JPG in background with progress and cancel. Preview the entire layout by scrolling. Runs in its own desktop window with native Save As dialogs. Includes v2 compaction, backfill, and warm starts. Includes Python and dependencies. 110 DPI paired panels; original QR codes and size labels retained. No per-panel confirmation. Runs locally inside the software window; does not open an external browser. Download BuxuNesting.exe and double-click.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag nesting/dist/BuxuNesting.exe --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'EXE upload failed' }
      - name: Publish verified binary branch
        id: binary
        shell: pwsh
        run: |
          Copy-Item nesting/dist/BuxuNesting.exe "$env:RUNNER_TEMP/BuxuNesting.exe"
          $sourceCommit = $env:GITHUB_SHA
          git ls-remote --exit-code --heads origin buxu-windows-builds *> $null
          if ($LASTEXITCODE -eq 0) {
            git fetch origin buxu-windows-builds
            git switch --force-create buxu-windows-builds FETCH_HEAD
          } else {
            git switch --orphan buxu-windows-builds
          }
          Copy-Item "$env:RUNNER_TEMP/BuxuNesting.exe" BuxuNesting.exe -Force
          $hash = (Get-FileHash BuxuNesting.exe -Algorithm SHA256).Hash.ToLower()
          @{sourceCommit=$sourceCommit;workflowRun=$env:GITHUB_RUN_ID;sha256=$hash;bytes=(Get-Item BuxuNesting.exe).Length;selfTest='passed';windowTest='passed';embedded=$true;platform='Windows x64';dpi=110} | ConvertTo-Json | Out-File build.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuxuNesting.exe build.json
          git commit -m "Publish verified Buxu Windows EXE"
          git push origin HEAD:refs/heads/buxu-windows-builds
          if ($LASTEXITCODE -ne 0) { throw 'Binary branch push failed' }
      - name: Publish build result for Git-based verification
        if: always()
        shell: pwsh
        run: |
          git fetch origin buxu-build-status *> $null
          if ($LASTEXITCODE -eq 0) {
            git switch --force-create buxu-build-status FETCH_HEAD
          } else {
            git switch --orphan buxu-build-status
          }
          $report = @{status='${{ job.status }}';sourceCommit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;install='${{ steps.install.outcome }}';tests='${{ steps.tests.outcome }}';package='${{ steps.package.outcome }}';selftest='${{ steps.selftest.outcome }}';release='${{ steps.release.outcome }}';binary='${{ steps.binary.outcome }}'}
          $log = "$env:LOCALAPPDATA/BuxuNesting/desktop.log"
          if (Test-Path $log) { $report.selfTestLog = Get-Content $log -Raw }
          $tests = "$env:RUNNER_TEMP/buxu-tests.log"
          if (Test-Path $tests) { $report.testLog = (Get-Content $tests -Tail 160) -join "`n" }
          $report | ConvertTo-Json | Out-File build-status.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status.json
          git commit -m 'Record Buxu Windows build result'
          git push origin HEAD:refs/heads/buxu-build-status
          if ($LASTEXITCODE -ne 0) { throw 'Build status push failed' }
