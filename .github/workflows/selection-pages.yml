name: Publish Selection Web to Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['selection/**', 'browser-collector/**', 'scripts/package_browser_collector.py', '.github/workflows/selection-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: selection-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Bundle downloadable collector extension
        run: python3 scripts/package_browser_collector.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: selection
      - name: Deploy static selection page
        id: deployment
        uses: actions/deploy-pages@v4
