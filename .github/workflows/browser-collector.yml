name: Package Browser Collector
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['browser-collector/**', 'tests/browser-collector.test.mjs', 'tests/browser-zip.test.mjs', '.github/workflows/browser-collector.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check browser-collector/background.js
          node --check browser-collector/extract.js
          node --check browser-collector/pagination.js
          node --check browser-collector/popup.js
          node --check browser-collector/zip.js
          node --check browser-collector/zip-offscreen.js
          node --test tests/browser-collector.test.mjs tests/browser-zip.test.mjs
          python3 -m json.tool browser-collector/manifest.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Feifan-Browser-Collector
          path: browser-collector/
