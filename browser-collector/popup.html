<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>body{width:360px;margin:0;padding:20px;font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#23483c;background:#f7f8f2}h1{font-size:21px;margin:0}small,p{color:#778375}button{padding:10px;border-radius:7px;border:1px solid #d4ddcd;background:white;color:#254d40;cursor:pointer}button.primary{background:#254d40;color:white}button:disabled{opacity:.5}.row{display:flex;gap:8px;margin:10px 0}.row button{flex:1}.box{padding:12px;background:white;border:1px solid #e2e7d9;border-radius:8px;margin-top:15px}label{display:inline-block;margin-right:12px}#message{min-height:22px;color:#886a30}#logs{max-height:180px;overflow:auto;font-size:11px;white-space:pre-wrap}a{color:#254d40}</style></head><body><h1>飞凡选款 · 浏览器采集</h1><small>读取当前 Chrome 登录状态，不读取或导出密码</small><div class="row"><button class="primary" id="capture">采集当前页</button><button id="openPinterest">打开我的 Pinterest 首页</button></div><p>Pinterest 仅采集首页推荐中已加载的图片。主页推荐不保证都是印花，点赞和收藏数未公开时留空。</p><div class="box"><b>每日自动采集 · 北京时间 09:00</b><div id="targets"><label><input type="checkbox" value="temu-store" checked>Temu</label><label><input type="checkbox" value="shein-store" checked>SHEIN</label><label><input type="checkbox" value="litb-search" checked>LightInTheBox</label><label><input type="checkbox" value="pinterest-home" checked>Pinterest 首页</label></div><div class="row"><button id="enable">授权并开启</button><button id="disable">关闭定时</button></div><button id="daily">现在执行一轮</button><p id="schedule">读取状态…</p><small>电脑和 Chrome 需运行。成功后关闭采集专用标签；需要登录或验证时保留标签，供你手动处理。</small></div><div class="row"><button id="sync">同步在线表格</button><button id="export">导出 JSON</button></div><div id="message" role="status"></div><div class="box"><b id="count">采集记录</b><div id="logs"></div></div><script src="popup.js"></script></body></html>
